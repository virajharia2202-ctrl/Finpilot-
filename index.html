const firebaseConfig = {
  apiKey: "AIzaSyA2fN4dR88eYOtZ5VoZ2QJuT1DdcBu5Mr0",
  authDomain: "finpilot-b2d81.firebaseapp.com",
  projectId: "finpilot-b2d81",
  storageBucket: "finpilot-b2d81.firebasestorage.app",
  messagingSenderId: "714059291849",
  appId: "1:714059291849:web:adf97ff074613f2e698118"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ── State ──
let currentUser=null, transactions=[], budgets=[], goals=[], accounts=[], recurring=[];
let unsubTx=null, unsubBudget=null, unsubGoals=null, unsubAccounts=null, unsubRecurring=null;
let activeTab='home';

// ── Theme ──
let appTheme = localStorage.getItem('fp_theme')||'dark';
const applyTheme = () => { document.documentElement.setAttribute('data-theme', appTheme); localStorage.setItem('fp_theme', appTheme); };
applyTheme();

// ── Currency ──
const CURRENCIES=[
  {code:'INR',symbol:'₹',name:'Indian Rupee'},{code:'USD',symbol:'$',name:'US Dollar'},
  {code:'EUR',symbol:'€',name:'Euro'},{code:'GBP',symbol:'£',name:'British Pound'},
  {code:'JPY',symbol:'¥',name:'Japanese Yen'},{code:'CAD',symbol:'CA$',name:'Canadian Dollar'},
  {code:'AUD',symbol:'A$',name:'Australian Dollar'},{code:'SGD',symbol:'S$',name:'Singapore Dollar'},
  {code:'AED',symbol:'AED',name:'UAE Dirham'},{code:'CHF',symbol:'Fr',name:'Swiss Franc'},
  {code:'CNY',symbol:'CN¥',name:'Chinese Yuan'},{code:'BRL',symbol:'R$',name:'Brazilian Real'},
];
let userCurrency = JSON.parse(localStorage.getItem('fp_currency')||'{"code":"INR","symbol":"₹","name":"Indian Rupee"}');
const CS = () => { try{const s=localStorage.getItem('fp_currency');if(s)userCurrency=JSON.parse(s);}catch(e){} return userCurrency.symbol; };
const setCurrency = c => { userCurrency=c; localStorage.setItem('fp_currency',JSON.stringify(c)); };

// ── Categories ──
const CATS = {
  income:[
    {id:'salary',label:'Salary',icon:'💼',color:'#10B981'},{id:'freelance',label:'Freelance',icon:'💻',color:'#3B82F6'},
    {id:'investment',label:'Investment',icon:'📈',color:'#8B5CF6'},{id:'gift',label:'Gift',icon:'🎁',color:'#EC4899'},
    {id:'business',label:'Business',icon:'🏢',color:'#F59E0B'},{id:'other_inc',label:'Other',icon:'💰',color:'#6B7280'},
  ],
  expense:[
    {id:'food',label:'Food',icon:'🍔',color:'#EF4444'},{id:'transport',label:'Transport',icon:'🚗',color:'#F97316'},
    {id:'shopping',label:'Shopping',icon:'🛍️',color:'#EC4899'},{id:'entertain',label:'Fun',icon:'🎬',color:'#8B5CF6'},
    {id:'health',label:'Health',icon:'💊',color:'#10B981'},{id:'bills',label:'Bills',icon:'📄',color:'#3B82F6'},
    {id:'education',label:'Education',icon:'📚',color:'#F59E0B'},{id:'travel',label:'Travel',icon:'✈️',color:'#6366F1'},
    {id:'groceries',label:'Groceries',icon:'🛒',color:'#14B8A6'},{id:'other_exp',label:'Other',icon:'💸',color:'#6B7280'},
  ]
};
const allCats=[...CATS.income,...CATS.expense];
const getCat=id=>allCats.find(c=>c.id===id)||{id,label:id,icon:'💰',color:'#6B7280'};
const fmt=n=>parseFloat(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtC=n=>CS()+fmt(n);
const fmtShort=n=>{const v=parseFloat(n||0);if(v>=10000000)return CS()+(v/10000000).toFixed(1)+'Cr';if(v>=100000)return CS()+(v/100000).toFixed(1)+'L';if(v>=1000)return CS()+(v/1000).toFixed(1)+'K';return fmtC(v);};
const fmtDate=d=>{try{return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}catch{return d;}};
const today=()=>new Date().toISOString().split('T')[0];
const currMonth=()=>new Date().toISOString().substring(0,7);
const monthLabel=()=>new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});

// ── Auth ──
onAuthStateChanged(auth, user => {
  currentUser=user;
  if(user){startListeners();showApp();}
  else{stopListeners();showAuth('login');}
});

function startListeners(){
  const uid=currentUser.uid;
  unsubTx=onSnapshot(query(collection(db,'users',uid,'transactions'),orderBy('date','desc')),snap=>{
    transactions=snap.docs.map(d=>({id:d.id,...d.data()}));
    refresh(); checkAlerts();
  });
  unsubBudget=onSnapshot(collection(db,'users',uid,'budgets'),snap=>{budgets=snap.docs.map(d=>({id:d.id,...d.data()}));refresh();});
  unsubGoals=onSnapshot(collection(db,'users',uid,'goals'),snap=>{goals=snap.docs.map(d=>({id:d.id,...d.data()}));if(activeTab==='goals')renderGoals();if(activeTab==='home')renderHome();});
  unsubAccounts=onSnapshot(collection(db,'users',uid,'accounts'),snap=>{accounts=snap.docs.map(d=>({id:d.id,...d.data()}));if(activeTab==='home')renderHome();if(activeTab==='accounts')renderAccounts();});
  unsubRecurring=onSnapshot(collection(db,'users',uid,'recurring'),snap=>{recurring=snap.docs.map(d=>({id:d.id,...d.data()}));if(activeTab==='recurring')renderRecurring();});
}
function stopListeners(){
  [unsubTx,unsubBudget,unsubGoals,unsubAccounts,unsubRecurring].forEach(u=>u&&u());
  transactions=[];budgets=[];goals=[];accounts=[];recurring=[];
}
function refresh(){
  if(activeTab==='home')renderHome();
  if(activeTab==='txns')renderTxns();
  if(activeTab==='insights')renderInsights();
  if(activeTab==='budget')renderBudget();
}

// ── Toast ──
function toast(msg,type='ok'){
  document.querySelectorAll('.fp-toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className=`fp-toast fp-toast-${type}`;t.innerHTML=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'),30);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},3000);
}

function checkAlerts(){
  const cm=currMonth();
  const mb=budgets.filter(b=>b.month===cm);
  const exTx=getMonthTx().filter(t=>t.type==='expense');
  mb.forEach(b=>{
    const spent=exTx.filter(t=>t.category===b.category).reduce((s,t)=>s+t.amount,0);
    const pct=b.amount>0?(spent/b.amount)*100:0;
    if(pct>=100) toast(`🚨 <b>${getCat(b.category).label}</b> budget exceeded!`,'err');
    else if(pct>=80) toast(`⚠️ <b>${getCat(b.category).label}</b> budget at ${pct.toFixed(0)}%`,'warn');
  });
}

// ── Auth UI ──
function showAuth(mode){
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  const isLogin=mode==='login';
  document.getElementById('auth-screen').innerHTML=`
  <div class="auth-wrap">
    <div class="auth-orb o1"></div><div class="auth-orb o2"></div>
    <div class="auth-box">
      <div class="auth-brand"><div class="auth-icon">✈</div><span>FinPilot</span><span class="v2-badge">2.0</span></div>
      <div class="auth-sub">Your intelligent money companion</div>
      <div class="auth-tabs">
        <button class="atab ${isLogin?'on':''}" onclick="window._sw('login')">Sign In</button>
        <button class="atab ${!isLogin?'on':''}" onclick="window._sw('register')">Sign Up</button>
      </div>
      <div id="auth-err" class="auth-err" style="display:none"></div>
      <div class="auth-fields">
        ${!isLogin?`<div class="fgroup"><label>Full Name</label><input id="a-name" class="finput" type="text" placeholder="Viraj Haria"></div>`:''}
        <div class="fgroup"><label>Email</label><input id="a-email" class="finput" type="email" placeholder="you@example.com"></div>
        <div class="fgroup"><label>Password</label>
          <div class="pw-wrap"><input id="a-pass" class="finput" type="password" placeholder="••••••••"><button onclick="window._eye('a-pass',this)">👁</button></div>
        </div>
        ${!isLogin?`<div class="fgroup"><label>Confirm Password</label>
          <div class="pw-wrap"><input id="a-pass2" class="finput" type="password" placeholder="••••••••"><button onclick="window._eye('a-pass2',this)">👁</button></div>
        </div>`:''}
      </div>
      <button class="auth-btn" id="auth-go" onclick="window._go('${mode}')">${isLogin?'Sign In →':'Create Account →'}</button>
      <div class="auth-switch">${isLogin?`No account? <span onclick="window._sw('register')">Sign up free</span>`:`Have account? <span onclick="window._sw('login')">Sign in</span>`}</div>
    </div>
  </div>`;
}
function showApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  setTab('home');
}
window._sw=m=>showAuth(m);
window._eye=(id,btn)=>{const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'👁':'🙈';};
window._go=async mode=>{
  const btn=document.getElementById('auth-go');
  const errEl=document.getElementById('auth-err'); errEl.style.display='none';
  const email=document.getElementById('a-email')?.value?.trim();
  const pass=document.getElementById('a-pass')?.value;
  if(!email||!pass){showErr('Please fill all fields.');return;}
  btn.textContent='···';btn.disabled=true;
  try{
    if(mode==='login'){
      await signInWithEmailAndPassword(auth,email,pass);
    }else{
      const name=document.getElementById('a-name')?.value?.trim();
      const pass2=document.getElementById('a-pass2')?.value;
      if(!name){showErr('Enter your name.');reset();return;}
      if(pass!==pass2){showErr('Passwords do not match.');reset();return;}
      if(pass.length<6){showErr('Password must be 6+ characters.');reset();return;}
      const cred=await createUserWithEmailAndPassword(auth,email,pass);
      await updateProfile(cred.user,{displayName:name});
      await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,email,displayName:name,createdAt:serverTimestamp()});
    }
  }catch(e){
    const msgs={'auth/email-already-in-use':'Email already registered.','auth/wrong-password':'Wrong password.','auth/user-not-found':'No account found.','auth/invalid-credential':'Invalid email or password.','auth/too-many-requests':'Too many attempts. Try later.'};
    showErr(msgs[e.code]||e.message);reset();
  }
  function showErr(m){errEl.style.display='flex';errEl.textContent=m;}
  function reset(){btn.textContent=mode==='login'?'Sign In →':'Create Account →';btn.disabled=false;}
};

// ── Nav ──
window.setTab=tab=>{
  activeTab=tab;
  document.querySelectorAll('.nav-btn').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));
  const pc=document.getElementById('page');
  pc.innerHTML='<div class="pg-load"><div class="spin"></div></div>';
  setTimeout(()=>{
    if(tab==='home') renderHome();
    else if(tab==='txns') renderTxns();
    else if(tab==='insights') renderInsights();
    else if(tab==='budget') renderBudget();
    else if(tab==='more') renderMore();
    else if(tab==='goals') renderGoals();
    else if(tab==='accounts') renderAccounts();
    else if(tab==='recurring') renderRecurring();
    else if(tab==='analytics') renderAnalytics();
    else if(tab==='settings') renderSettings();
  },60);
};

// ── Helpers ──
function getMonthTx(month){
  const m=month||currMonth();
  return transactions.filter(t=>{
    if(!t.date) return false;
    const ds=typeof t.date==='string'?t.date:(t.date.toDate?t.date.toDate().toISOString():String(t.date));
    return ds.substring(0,7)===m;
  });
}
// ALL TIME summary - fixes the balance bug
function getAllTimeSummary(){
  const income=transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return{income,expense,balance:income-expense};
}
function getMonthSummary(month){
  const tx=getMonthTx(month);
  const income=tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return{income,expense,balance:income-expense};
}
function getCatBreakdown(){
  const tx=transactions.filter(t=>t.type==='expense');
  const map={};tx.forEach(t=>map[t.category]=(map[t.category]||0)+t.amount);
  return Object.entries(map).map(([c,a])=>({category:c,amount:a})).sort((a,b)=>b.amount-a.amount);
}
function getBudgetUsage(){
  const cm=currMonth();const mb=budgets.filter(b=>b.month===cm);
  const exTx=getMonthTx().filter(t=>t.type==='expense');
  return mb.map(b=>{
    const spent=exTx.filter(t=>t.category===b.category).reduce((s,t)=>s+t.amount,0);
    const pct=b.amount>0?(spent/b.amount)*100:0;
    return{...b,spent,percentage:pct,exceeded:spent>b.amount};
  });
}
function getNetWorth(){return accounts.reduce((s,a)=>s+(a.balance||0),0);}

// ── HOME ──

      ${accounts.length?`<div class="hero-nw">Net Worth: <strong>${fmtC(netWorth)}</strong></div>`:''}

          <div class="hs-icon expense-bg">↓</div>
          <div><div class="hs-lbl">Total Spent</div><div class="hs-val expense-val">${fmtShort(at.expense)}</div></div>
        </div>
      </div>
    </div>

    <!-- This Month Card -->
    <div class="month-card">
      <div class="month-hdr">
        <span class="month-title">📅 ${monthLabel()}</span>
        <span class="month-bal ${ms.balance>=0?'income-val':'expense-val'}">${ms.balance>=0?'+':'-'}${fmtC(Math.abs(ms.balance))}</span>
      </div>
      <div class="month-row">
        <div class="month-stat">
          <div class="ms-dot" style="background:#10B981"></div>
          <div><div class="ms-lbl">Month Income</div><div class="ms-val income-val">${fmtC(ms.income)}</div></div>
        </div>
        <div class="month-stat">
          <div class="ms-dot" style="background:#EF4444"></div>
          <div><div class="ms-lbl">Month Spent</div><div class="ms-val expense-val">${fmtC(ms.expense)}</div></div>
        </div>
      </div>
      ${ms.income>0?`<div class="savings-bar-wrap">
        <div class="savings-bar-fill" style="width:${Math.min((ms.expense/ms.income)*100,100)}%;background:${ms.expense>ms.income?'#EF4444':'#10B981'}"></div>
        <div class="savings-bar-text">${ms.income>0?((ms.expense/ms.income)*100).toFixed(0):0}% of income spent</div>
      </div>`:''}
    </div>

    <!-- Quick Actions -->
    <div class="qa-grid">
      <button class="qa-card expense-qa" onclick="window.openAdd('expense')">
        <div class="qa-ico">💸</div><div class="qa-lbl">Add Expense</div>

      <button class="qa-card goal-qa" onclick="window.setTab('goals')">

      </button>
      <button class="qa-card acc-qa" onclick="window.setTab('accounts')">

      </button>
    </div>

    <!-- Goals Preview -->
    ${goals.filter(g=>g.saved<g.target).length?`

function txCard(tx,border=true){
  const cat=getCat(tx.category);
  return `<div class="tx-card ${border?'tx-sep':''}" onclick="window.delTx('${tx.id}','${(tx.note||cat.label).replace(/'/g,"\\'")}')">
    <div class="tx-cat-icon" style="background:${cat.color}18;border:1px solid ${cat.color}33">${cat.icon}</div>
    <div class="tx-info">
      <div class="tx-name">${tx.note||cat.label}</div>
      <div class="tx-meta">${cat.label}${tx.account?' · '+tx.account:''} · ${fmtDate(tx.date)}${tx.source==='sms'?' 📱':''}</div>
    </div>
    <div class="tx-amt ${tx.type==='income'?'income-val':'expense-val'}">${tx.type==='income'?'+':'-'}${fmtC(tx.amount)}</div>
  </div>`;
}

function renderCatGrid(type){
  return CATS[type].map(c=>`<button class="cg-btn" data-id="${c.id}" data-col="${c.color}" onclick="window._pickCat('${c.id}','${c.color}')">
    <span>${c.icon}</span><span>${c.label}</span>
  </button>`).join('');
}
window._swType=type=>{
  window._txType=type;window._txCat='';
  document.getElementById('sw-exp').className='sw-btn'+(type==='expense'?' sw-exp-on':'');
  document.getElementById('sw-inc').className='sw-btn'+(type==='income'?' sw-inc-on':'');
  document.getElementById('cat-grid').innerHTML=renderCatGrid(type);
};
window._pickCat=(id,col)=>{
  window._txCat=id;
  document.querySelectorAll('.cg-btn').forEach(b=>{const a=b.dataset.id===id;b.style.borderColor=a?col:'';b.style.background=a?col+'18':'';b.style.color=a?col:'';});
};
window._saveTx=async()=>{
  const amt=parseFloat(document.getElementById('tx-amt').value);
  const date=document.getElementById('tx-date').value;
  const note=document.getElementById('tx-note').value.trim();
  const acc=document.getElementById('tx-acc').value;
  const isRec=document.getElementById('tx-rec').checked;
  const err=document.getElementById('tx-err'); err.style.display='none';
  if(!amt||amt<=0){err.style.display='block';err.textContent='Enter a valid amount.';return;}
  if(!date){err.style.display='block';err.textContent='Select a date.';return;}
  if(!window._txCat){err.style.display='block';err.textContent='Select a category.';return;}
  const btn=document.getElementById('tx-go');btn.textContent='Saving···';btn.disabled=true;
  try{
    const d={type:window._txType,amount:amt,category:window._txCat,note,date,createdAt:serverTimestamp()};
    if(acc)d.account=acc;
    await addDoc(collection(db,'users',currentUser.uid,'transactions'),d);
    if(isRec) await addDoc(collection(db,'users',currentUser.uid,'recurring'),{type:window._txType,amount:amt,category:window._txCat,note,account:acc,dayOfMonth:new Date(date).getDate()||1,active:true,createdAt:serverTimestamp()});
    if(acc){const a=accounts.find(x=>x.name===acc);if(a){const nb=window._txType==='income'?(a.balance||0)+amt:(a.balance||0)-amt;await setDoc(doc(db,'users',currentUser.uid,'accounts',a.id),{...a,balance:nb});}}
    toast('✅ Transaction saved!');window.closeModal();
  }catch(e){err.style.display='block';err.textContent='Error. Try again.';btn.textContent='Save Transaction';btn.disabled=false;}
};
window.closeModal=()=>{document.getElementById('modal').style.display='none';document.getElementById('modal').innerHTML='';};
window.delTx=(id,name)=>{if(!confirm(`Delete "${name}"?`))return;deleteDoc(doc(db,'users',currentUser.uid,'transactions',id));toast('🗑️ Deleted');};

// ── TRANSACTIONS ──
let txF='all',txS='';
function renderTxns(){
  const filtered=transactions.filter(tx=>{
    if(txF!=='all'&&tx.type!==txF)return false;
    if(txS&&!(tx.note||'').toLowerCase().includes(txS.toLowerCase())&&!getCat(tx.category).label.toLowerCase().includes(txS.toLowerCase()))return false;
    return true;
  });
  // Group by date
  const groups={};
  filtered.forEach(tx=>{const d=tx.date||'Unknown';(groups[d]||(groups[d]=[])).push(tx);});
  const sortedDates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));

  document.getElementById('page').innerHTML=`
  <div class="pg">
    <div class="pg-hdr">
      <div class="pg-title">Transactions</div>
      <button class="hdr-plus" onclick="window.openAdd()">+</button>
    </div>
    <div class="search-box">
      <span>🔍</span>
      <input class="search-inp" type="text" placeholder="Search transactions..." value="${txS}" oninput="window._txS(this.value)">
      ${txS?`<button class="search-clr" onclick="window._txS('')">✕</button>`:''}
    </div>
    <div class="filter-tabs">
      ${['all','expense','income'].map(f=>`<button class="ftab ${txF===f?'ftab-on':''}" onclick="window._txF('${f}')">${f==='all'?'All':f==='expense'?'Expenses':'Income'}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--muted);padding:2px 16px 10px">${filtered.length} transaction${filtered.length!==1?'s':''}</div>
    ${filtered.length===0?`<div class="empty-state"><div class="es-emoji">📭</div><div class="es-title">Nothing found</div></div>`:`
    ${sortedDates.map(date=>`
      <div class="date-group">
        <div class="date-label">${date===today()?'Today':date===getYesterday()?'Yesterday':fmtDate(date)}</div>
        <div class="tx-list">${groups[date].map((tx,i)=>txCard(tx,i<groups[date].length-1)).join('')}</div>
      </div>`).join('')}`}
  </div>`;
}
function getYesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().split('T')[0];}
window._txF=f=>{txF=f;renderTxns();};
window._txS=v=>{txS=v;renderTxns();};

// ── INSIGHTS ──
function renderInsights(){
  const at=getAllTimeSummary();
  const ms=getMonthSummary();
  const breakdown=getCatBreakdown();
  const insights=genInsights();
  const months=[];
  for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const m=d.toISOString().substring(0,7);const s=getMonthSummary(m);months.push({label:d.toLocaleDateString('en-IN',{month:'short'}),income:s.income,expense:s.expense});}
  const maxV=Math.max(...months.map(m=>Math.max(m.income,m.expense)),1);

  document.getElementById('page').innerHTML=`
  <div class="pg">
    <div class="pg-hdr"><div class="pg-title">Insights</div><div class="pg-sub">${monthLabel()}</div></div>

    <!-- Summary Pills -->
    <div class="pill-row">
      <div class="pill income-pill"><div class="pill-lbl">All Time In</div><div class="pill-val income-val">${fmtShort(at.income)}</div></div>
      <div class="pill expense-pill"><div class="pill-lbl">All Time Out</div><div class="pill-val expense-val">${fmtShort(at.expense)}</div></div>
      <div class="pill balance-pill"><div class="pill-lbl">Net Balance</div><div class="pill-val ${at.balance>=0?'income-val':'expense-val'}">${fmtShort(Math.abs(at.balance))}</div></div>
    </div>

    <!-- Bar Chart -->
    <div class="section">
      <div class="sec-title" style="margin-bottom:12px">📊 6-Month Overview</div>
      <div class="chart-card">
        <div class="chart-legend"><span class="ldot" style="background:#10B981"></span>Income <span class="ldot" style="background:#EF4444;margin-left:10px"></span>Expense</div>
        <div class="bar-chart">${months.map(m=>`
          <div class="bcol">
            <div class="bcol-bars">
              <div class="bbar inc-bar" style="height:${m.income>0?Math.max((m.income/maxV)*100,3):0}%" title="${fmtC(m.income)}"></div>
              <div class="bbar exp-bar" style="height:${m.expense>0?Math.max((m.expense/maxV)*100,3):0}%" title="${fmtC(m.expense)}"></div>
            </div>
            <div class="bcol-lbl">${m.label}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- Category Breakdown -->
    ${breakdown.length?`
    <div class="section">
      <div class="sec-title" style="margin-bottom:12px">💸 Spending by Category</div>
      <div class="chart-card">${breakdown.slice(0,6).map(item=>{
        const cat=getCat(item.category);
        const tot=breakdown.reduce((s,b)=>s+b.amount,0);
        const pct=tot>0?(item.amount/tot)*100:0;
        return `<div class="breakdown-row">
          <div class="br-left"><span>${cat.icon}</span><span class="br-name">${cat.label}</span></div>
          <div class="br-bar-wrap"><div class="br-bar" style="width:${Math.min(pct,100)}%;background:${cat.color}"></div></div>
          <span class="br-pct">${pct.toFixed(0)}%</span>
          <span class="br-amt">${fmtShort(item.amount)}</span>
        </div>`;
      }).join('')}</div>
    </div>`:''}

    <!-- Smart Insights -->
    <div class="section">
      <div class="sec-title" style="margin-bottom:12px">🤖 Smart Insights</div>
      ${insights.length===0?`<div class="empty-state"><div class="es-emoji">🔮</div><div class="es-title">Add more transactions</div><div class="es-sub">Insights will appear here</div></div>`:
      insights.map(ins=>`<div class="insight-card" style="border-left:3px solid ${ins.color}">
        <div class="ic-hdr"><span class="ic-ico">${ins.icon}</span><span class="ic-title">${ins.title}</span></div>
        <div class="ic-body">${ins.body}</div>
      </div>`).join('')}
    </div>
  </div>`;
}
function genInsights(){
  const ins=[];if(!transactions.length)return ins;
  const at=getAllTimeSummary();const ms=getMonthSummary();const bd=getCatBreakdown();
  if(at.income>0){
    const rate=((at.income-at.expense)/at.income)*100;
    if(rate>=30)ins.push({icon:'🏆',title:'Excellent savings!',body:`You've saved ${rate.toFixed(0)}% of all your income overall. Outstanding!`,color:'#10B981'});
    else if(rate<0)ins.push({icon:'⚠️',title:'Spending exceeds income',body:`Your total expenses are ${fmtC(Math.abs(at.balance))} more than income.`,color:'#EF4444'});
    else ins.push({icon:'💡',title:'Savings opportunity',body:`You're saving ${rate.toFixed(0)}% overall. Try to reach 30%+ for financial health.`,color:'#F59E0B'});
  }
  if(ms.income>0){const mr=((ms.income-ms.expense)/ms.income)*100;ins.push({icon:'📅',title:`This month: ${mr>=0?'+':''} ${mr.toFixed(0)}%`,body:`${monthLabel()}: Income ${fmtC(ms.income)}, Spent ${fmtC(ms.expense)}, Saved ${fmtC(ms.balance)}.`,color:mr>=0?'#10B981':'#EF4444'});}
  if(bd.length>0){const top=getCat(bd[0].category);const tot=bd.reduce((s,b)=>s+b.amount,0);const pct=tot>0?(bd[0].amount/tot)*100:0;ins.push({icon:top.icon,title:`${top.label} is your biggest expense`,body:`${fmtC(bd[0].amount)} (${pct.toFixed(0)}% of total expenses) on ${top.label}.`,color:top.color});}
  if(transactions.length>=5){const avgExp=at.expense/Math.max(transactions.filter(t=>t.type==='expense').length,1);ins.push({icon:'📊',title:`${transactions.length} transactions total`,body:`Average expense: ${fmtC(avgExp)} per transaction.`,color:'#8B5CF6'});}
  if(goals.length>0){const near=goals.find(g=>(g.saved/g.target)>=0.7&&g.saved<g.target);if(near)ins.push({icon:'🎯',title:'Goal almost there!',body:`"${near.name}" is ${((near.saved/near.target)*100).toFixed(0)}% funded. Just ${fmtC(near.target-near.saved)} more!`,color:'#10B981'});}
  return ins;
}

window._saveGoal=async()=>{
  const name=document.getElementById('gn').value.trim();const target=parseFloat(document.getElementById('gt').value);const saved=parseFloat(document.getElementById('gs').value)||0;const date=document.getElementById('gd').value;
  const err=document.getElementById('ge');err.style.display='none';

window._csv=()=>{
  if(!transactions.length){toast('No data to export','warn');return;}
  const rows=[['Date','Type','Category','Amount','Note','Account'],...transactions.map(t=>[t.date,t.type,getCat(t.category).label,t.amount,t.note||'',t.account||''])];
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finpilot-transactions.csv';a.click();

window._sms=()=>{
  const sms=document.getElementById('sms-in').value.trim();
  const out=document.getElementById('sms-out');
  if(!sms){out.style.display='block';out.innerHTML='<div class="ferr">Paste an SMS first.</div>';return;}
  const p=parseSMS(sms);
  if(!p){out.style.display='block';out.innerHTML='<div class="ferr">Could not detect a transaction.</div>';return;}
  const cat=getCat(p.category);
  out.style.display='block';
  out.innerHTML=`<div class="sms-result">
    <div class="sr-title">✅ Detected!</div>
    <div class="sr-row2"><span>Type</span><span class="${p.type==='income'?'income-val':'expense-val'}">${p.type==='income'?'💰 Income':'💸 Expense'}</span></div>
    <div class="sr-row2"><span>Amount</span><span style="font-weight:700">${fmtC(p.amount)}</span></div>
    <div class="sr-row2"><span>Merchant</span><span>${p.note}</span></div>
    <div class="sr-row2"><span>Category</span><span>${cat.icon} ${cat.label}</span></div>
    <div class="sr-row2"><span>Date</span><span>${p.date}</span></div>
    <button class="submit-btn" style="margin-top:10px" onclick="window._addSMS(${JSON.stringify(p).replace(/"/g,'&quot;')})">+ Add Transaction</button>
  </div>`;
};
function parseSMS(sms){
  const s=sms.toLowerCase();
  let type='expense';
  if(/credit|credited|received|deposited|refund|cashback/.test(s)) type='income';
  if(/debit|debited|paid|payment|withdrawn|purchase/.test(s)) type='expense';
  let amount=null;
  const ps=[/(?:inr|rs\.?|usd|\$|gbp|aed|eur)\s*([\d,]+\.?\d*)/i,/([\d,]+\.\d{2})\s*(?:inr|rs|debited|credited)/i,/(?:debited|credited)\s*(?:inr|rs\.)?\s*([\d,]+\.?\d*)/i];
  for(const p of ps){const m=sms.match(p);if(m){amount=parseFloat(m[1].replace(/,/g,''));break;}}
  if(!amount||amount<=0)return null;
  let note='';
  const mp=[/(?:at|to|from)\s+([A-Z][A-Z\s\.\-&]{2,25})/i,/(?:towards)\s+([A-Z][A-Z\s\.\-&]{2,25})/i];
  for(const p of mp){const m=sms.match(p);if(m){note=m[1].trim();break;}}
  if(!note)note=type==='income'?'Bank Credit':'Bank Debit';
  let category=type==='income'?'other_inc':'other_exp';
  const rules=[
    {cat:'food',words:['zomato','swiggy','dominos','pizza','mcdonalds','kfc','restaurant','starbucks','food']},
    {cat:'transport',words:['uber','ola','rapido','irctc','metro','petrol','fastag']},
    {cat:'shopping',words:['amazon','flipkart','myntra','zara','nykaa','meesho']},
    {cat:'groceries',words:['bigbasket','grofers','blinkit','zepto','dmart','grocery']},
    {cat:'bills',words:['airtel','jio','vodafone','electricity','bsnl','bill','recharge']},
    {cat:'health',words:['hospital','apollo','doctor','medplus','1mg','pharmacy']},
    {cat:'entertain',words:['netflix','hotstar','spotify','bookmyshow','pvr','cinema']},
    {cat:'travel',words:['makemytrip','goibibo','hotel','flight','indigo','spicejet']},
    {cat:'salary',words:['salary','payroll','wages']},
    {cat:'investment',words:['zerodha','groww','sip','mutual fund','shares']},
  ];
  for(const r of rules){if(r.words.some(w=>sms.toLowerCase().includes(w)||note.toLowerCase().includes(w))){category=r.cat;break;}}
  let date=new Date().toISOString().split('T')[0];
  const dp=[/(\d{2})[\/\-](\d{2})[\/\-](\d{2,4})/];
  for(const p of dp){const m=sms.match(p);if(m){try{const d=new Date(m[0]);if(!isNaN(d))date=d.toISOString().split('T')[0];}catch{}break;}}
  return{type,amount,note,category,date};
}
window._addSMS=async p=>{
  try{
    await addDoc(collection(db,'users',currentUser.uid,'transactions'),{...p,createdAt:serverTimestamp(),source:'sms'});
    document.getElementById('sms-out').innerHTML='<div class="success-msg">✅ Added successfully!</div>';
    document.getElementById('sms-in').value='';
    toast('✅ SMS transaction added!');
  }catch(e){toast('Error','err');}
};
window._receipt=file=>{
  const out=document.getElementById('receipt-out');out.style.display='block';

      <button class="submit-btn" style="margin-top:8px" onclick="window._receiptAdd(${amt})">+ Add as Expense</button>
    </div>`;
  },1500);
  if(file.files[0]){const r=new FileReader();r.readAsDataURL(file.files[0]);}
};
window._receiptAdd=amt=>{window.openAdd('expense');setTimeout(()=>{const i=document.getElementById('tx-amt');if(i)i.value=amt;},200);};
window._out=async()=>{if(!confirm('Sign out of FinPilot?'))return;await signOut(auth);};

.auth-tabs{display:flex;background:var(--elevated);border-radius:var(--r);padding:4px;margin-bottom:20px;}
.atab{flex:1;padding:9px;border-radius:calc(var(--r) - 2px);border:none;font-family:var(--font);font-size:13px;font-weight:600;color:var(--text2);background:transparent;cursor:pointer;transition:all 0.2s;}
.atab.on{background:linear-gradient(135deg,#10B981,#059669);color:#fff;}
.auth-err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--r);padding:10px 14px;font-size:13px;color:#EF4444;margin-bottom:14px;}
.auth-fields{display:flex;flex-direction:column;gap:12px;}
.fgroup{display:flex;flex-direction:column;gap:5px;}
.fgroup label{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
.finput,.fi{background:var(--input);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--text);font-family:var(--font);width:100%;outline:none;transition:border-color 0.2s;}
.finput:focus,.fi:focus{border-color:var(--primary);}
.pw-wrap{display:flex;background:var(--input);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.pw-wrap:focus-within{border-color:var(--primary);}
.pw-wrap .finput{border:none;background:transparent;}
.pw-wrap button{background:none;border:none;padding:12px;cursor:pointer;font-size:16px;}
.auth-btn{width:100%;margin-top:16px;padding:13px;background:linear-gradient(135deg,#10B981,#059669);border:none;border-radius:var(--r);font-family:var(--font);font-size:14px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:0.3px;transition:opacity 0.2s;}
.auth-btn:hover{opacity:0.9;}
.auth-btn:disabled{opacity:0.5;}
.auth-switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text2);}
.auth-switch span{color:var(--primary);cursor:pointer;font-weight:600;}

/* APP */
#app{display:none;flex-direction:column;height:100dvh;height:100vh;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;}
#app{height:-webkit-fill-available;}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg);}
.tb-logo{display:flex;align-items:center;gap:6px;}
.tb-logo-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#10B981,#059669);display:flex;align-items:center;justify-content:center;font-size:14px;}
.tb-name{font-size:16px;font-weight:800;letter-spacing:-0.3px;color:var(--primary);}
.tb-v{font-size:10px;color:var(--text2);font-weight:600;background:var(--elevated);padding:2px 6px;border-radius:6px;margin-left:2px;}
.tb-right{display:flex;gap:7px;}
.tb-btn{width:30px;height:30px;border-radius:50%;background:var(--elevated);border:1px solid var(--border);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.tb-plus{background:var(--primary);border-color:var(--primary);color:#fff;font-size:18px;font-weight:700;line-height:1;}

/* PAGE */
#page{flex:1;overflow:hidden;position:relative;}
.pg{height:100%;overflow-y:auto;padding-bottom:16px;}
.pg::-webkit-scrollbar{display:none;}
.pg-load{display:flex;align-items:center;justify-content:center;height:200px;}
.spin{width:24px;height:24px;border:3px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:rot 0.7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}

/* BOTTOM NAV */
.bottom-nav{display:flex;background:var(--card);border-top:1px solid var(--border);padding:6px 0 max(10px,env(safe-area-inset-bottom));flex-shrink:0;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;border:none;background:none;font-family:var(--font);}
.nav-ico{font-size:20px;opacity:0.35;transition:opacity 0.15s;}
.nav-lbl{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:0.3px;}
.nav-btn.active .nav-ico{opacity:1;}
.nav-btn.active .nav-lbl{color:var(--primary);}

/* HOME */
.home-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;}
.greet{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-0.3px;}
.greet-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.hdr-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#A78BFA);border:none;font-size:14px;font-weight:800;color:#fff;cursor:pointer;}
.alert-bar{margin:0 16px 8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:var(--r);padding:9px 14px;font-size:12px;font-weight:600;color:#EF4444;cursor:pointer;}

/* HERO CARD */
.hero-card{margin:4px 16px 0;border-radius:var(--rxl);padding:20px;background:linear-gradient(135deg,#0D1F18,#0A0A18);border:1px solid #1E2E28;position:relative;overflow:hidden;}
.hero-bg-circle{position:absolute;top:-60px;left:-60px;width:200px;height:200px;border-radius:50%;background:rgba(16,185,129,0.07);pointer-events:none;}
.hero-bg-circle2{position:absolute;bottom:-40px;right:-40px;width:150px;height:150px;border-radius:50%;background:rgba(139,92,246,0.05);pointer-events:none;}
.hero-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:2px;margin-bottom:6px;}
.hero-amount{font-size:34px;font-weight:900;letter-spacing:-2px;line-height:1;}
.hero-amount.pos{color:#10B981;}
.hero-amount.neg{color:#EF4444;}
.hero-full{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px;margin-bottom:4px;letter-spacing:0.3px;}
.hero-nw{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:14px;}
.hero-row{display:flex;background:rgba(0,0,0,0.3);border-radius:12px;padding:12px;}
.hero-stat{flex:1;display:flex;align-items:center;gap:8px;}
.hs-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;}
.income-bg{background:rgba(16,185,129,0.25);}
.expense-bg{background:rgba(239,68,68,0.25);}
.hs-lbl{font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:0.5px;margin-bottom:2px;}
.hs-val{font-size:14px;font-weight:800;}
.hero-divider{width:1px;background:rgba(255,255,255,0.1);margin:0 12px;}

/* MONTH CARD */
.month-card{margin:10px 16px 0;background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:14px;}
.month-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.month-title{font-size:13px;font-weight:700;color:var(--text);}
.month-bal{font-size:14px;font-weight:800;}
.month-row{display:flex;gap:16px;margin-bottom:10px;}
.month-stat{flex:1;display:flex;align-items:center;gap:6px;}
.ms-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ms-lbl{font-size:10px;color:var(--muted);margin-bottom:1px;}
.ms-val{font-size:13px;font-weight:700;}
.savings-bar-wrap{height:6px;background:var(--elevated);border-radius:3px;overflow:hidden;position:relative;}
.savings-bar-fill{height:100%;border-radius:3px;transition:width 0.5s;}
.savings-bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,0.5);font-weight:600;}

/* QUICK ACTIONS */
.qa-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px 16px 0;}
.qa-card{border:none;border-radius:var(--rl);padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.15s;font-family:var(--font);}
.qa-ico{font-size:22px;}
.qa-lbl{font-size:10px;font-weight:700;}
.expense-qa{background:rgba(239,68,68,0.12);color:#EF4444;border:1px solid rgba(239,68,68,0.2);}
.income-qa{background:rgba(16,185,129,0.12);color:#10B981;border:1px solid rgba(16,185,129,0.2);}
.goal-qa{background:rgba(139,92,246,0.12);color:#8B5CF6;border:1px solid rgba(139,92,246,0.2);}
.acc-qa{background:rgba(59,130,246,0.12);color:#3B82F6;border:1px solid rgba(59,130,246,0.2);}

/* SECTION */
.section{padding:14px 16px 0;}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sec-title{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-0.2px;}
.sec-link{font-size:12px;color:var(--primary);font-weight:600;background:none;border:none;cursor:pointer;font-family:var(--font);}

/* GOAL PILLS */
.scroll-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.scroll-row::-webkit-scrollbar{display:none;}
.goal-pill{min-width:110px;background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:12px;cursor:pointer;flex-shrink:0;}
.gp-icon{font-size:22px;margin-bottom:6px;}
.gp-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gp-bar{height:4px;background:var(--elevated);border-radius:2px;overflow:hidden;margin-bottom:4px;}
.gp-fill{height:100%;border-radius:2px;background:var(--primary);}
.gp-pct{font-size:10px;font-weight:700;color:var(--primary);}

/* TRANSACTIONS */
.tx-list{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);overflow:hidden;}
.tx-card{display:flex;align-items:center;padding:12px 14px;cursor:pointer;transition:background 0.1s;}
.tx-card:active{background:var(--elevated);}
.tx-sep{border-bottom:1px solid var(--border);}
.tx-cat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:10px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-meta{font-size:11px;color:var(--muted);margin-top:1px;}
.tx-amt{font-size:13px;font-weight:800;flex-shrink:0;margin-left:8px;}
.income-val{color:var(--income);}
.expense-val{color:var(--expense);}

/* EMPTY STATE */
.empty-state{padding:40px 24px;text-align:center;}
.es-emoji{font-size:48px;margin-bottom:12px;}
.es-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px;}
.es-sub{font-size:13px;color:var(--text2);margin-bottom:16px;}
.es-btn{padding:10px 24px;background:var(--primary);border:none;border-radius:var(--rf);font-family:var(--font);font-size:13px;font-weight:700;color:#fff;cursor:pointer;}

/* PAGE HEADERS */
.pg-hdr{display:flex;justify-content:space-between;align-items:center;padding:13px 16px 8px;}
.pg-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.5px;}
.pg-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.hdr-plus{width:30px;height:30px;border-radius:50%;background:var(--primary);border:none;font-size:20px;color:#fff;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.hdr-add-btn{padding:7px 13px;background:var(--primary);border:none;border-radius:var(--rf);font-family:var(--font);font-size:12px;font-weight:700;color:#fff;cursor:pointer;}

/* DATE GROUPS */
.date-group{margin-bottom:4px;}
.date-label{font-size:11px;font-weight:700;color:var(--muted);padding:12px 16px 6px;text-transform:uppercase;letter-spacing:0.5px;}

/* SEARCH */
.search-box{display:flex;align-items:center;margin:0 16px 8px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:0 12px;gap:8px;font-size:14px;}
.search-inp{flex:1;background:transparent;border:none;padding:11px 0;font-size:13px;color:var(--text);font-family:var(--font);outline:none;}
.search-inp::placeholder{color:var(--muted);}
.search-clr{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;}
.filter-tabs{display:flex;gap:7px;padding:0 16px 6px;}
.ftab{padding:6px 14px;border-radius:var(--rf);background:var(--card);border:1px solid var(--border2);font-family:var(--font);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;}
.ftab.ftab-on{background:var(--primary-dim);border-color:var(--primary);color:var(--primary);}

/* INSIGHTS/ANALYTICS */
.pill-row{display:flex;gap:7px;padding:0 16px;}
.pill{flex:1;padding:12px 8px;border-radius:var(--rl);border:1px solid var(--border2);background:var(--card);}
.income-pill{background:rgba(16,185,129,0.06);}
.expense-pill{background:rgba(239,68,68,0.06);}
.balance-pill{background:rgba(139,92,246,0.06);}
.pill-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:0.5px;margin-bottom:4px;}
.pill-val{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chart-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:14px;}
.chart-legend{display:flex;align-items:center;gap:4px;margin-bottom:12px;font-size:12px;color:var(--text2);}
.ldot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:110px;}
.bar-sm{height:90px;}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;}
.bcol-bars{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%;}
.bbar{flex:1;border-radius:3px 3px 0 0;min-height:3px;transition:height 0.5s;}
.inc-bar{background:#10B981;opacity:0.85;}
.exp-bar{background:#EF4444;opacity:0.85;}
.bcol-lbl{font-size:8px;color:var(--muted);text-align:center;}
.breakdown-row{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--border);}
.breakdown-row:last-child{border-bottom:none;}
.br-left{display:flex;align-items:center;gap:5px;width:90px;flex-shrink:0;font-size:13px;}
.br-name{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.br-bar-wrap{flex:1;height:6px;background:var(--elevated);border-radius:3px;overflow:hidden;}
.br-bar{height:100%;border-radius:3px;}
.br-pct{font-size:10px;font-weight:700;color:var(--muted);width:26px;text-align:right;flex-shrink:0;}
.br-amt{font-size:11px;font-weight:700;color:var(--text);width:50px;text-align:right;flex-shrink:0;}
.insight-card{background:var(--card);border-radius:var(--r);padding:12px 12px 12px 14px;border:1px solid var(--border2);margin-bottom:8px;}
.ic-hdr{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.ic-ico{font-size:16px;}
.ic-title{font-size:13px;font-weight:700;color:var(--text);}
.ic-body{font-size:12px;color:var(--text2);line-height:17px;}
.stats-4{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 14px;}
.s4{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:12px;text-align:center;overflow:hidden;}
.s4-val{font-size:14px;font-weight:800;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s4-lbl{font-size:10px;color:var(--muted);}
.sr-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);}
.sr-row:last-child{border-bottom:none;}
.sr-lbl{font-size:11px;color:var(--text2);width:48px;flex-shrink:0;}
.sr-bar-wrap{flex:1;height:7px;background:var(--elevated);border-radius:4px;overflow:hidden;}
.sr-bar{height:100%;border-radius:4px;max-width:100%;}
.sr-pos{background:var(--income);}
.sr-neg{background:var(--expense);}
.sr-pct{font-size:11px;font-weight:700;width:34px;text-align:right;flex-shrink:0;}

/* BUDGET */
.budget-overview{margin:0 16px 14px;background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:14px;}
.bo-item{flex:1;text-align:center;}
.bo-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:3px;text-transform:uppercase;}
.bo-val{font-size:14px;font-weight:800;}
.budget-overview{display:flex;flex-direction:column;}
.budget-overview>.bo-item{display:none;}
.bo-alert{margin-top:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:8px;padding:8px;text-align:center;font-size:12px;font-weight:600;color:#EF4444;}
.budget-overview{flex-direction:row;align-items:center;}
.budget-overview>.bo-item{display:block;}
.budget-overview>.bo-alert{display:none;}
.bud-overview-alert{margin:8px 16px 0;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:8px;padding:8px;text-align:center;font-size:12px;font-weight:600;color:#EF4444;}
.bud-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:14px;margin:0 16px 10px;}
.bud-over{border-color:rgba(239,68,68,0.4);}
.bud-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.bud-left{display:flex;align-items:center;gap:9px;}
.bud-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.bud-name{font-size:13px;font-weight:700;color:var(--text);}
.bud-month{font-size:10px;color:var(--muted);}
.bud-track{height:7px;background:var(--elevated);border-radius:4px;overflow:hidden;margin-bottom:8px;}
.bud-fill{height:100%;border-radius:4px;transition:width 0.5s;}
.bud-nums{display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.bud-pct{padding:2px 8px;border-radius:var(--rf);font-size:11px;font-weight:700;}
.bud-over-msg{margin-top:8px;background:rgba(239,68,68,0.1);border-radius:7px;padding:6px;font-size:11px;font-weight:600;color:#EF4444;}

/* GOALS */
.goals-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.goal-card-v2{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:14px;}
.gc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.gc-icon{font-size:28px;}
.gc-name{font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px;}
.gc-target{font-size:11px;color:var(--muted);margin-bottom:10px;}
.gc-track{height:6px;background:var(--elevated);border-radius:3px;overflow:hidden;margin-bottom:8px;}
.gc-fill{height:100%;border-radius:3px;transition:width 0.5s;}
.gc-bottom{display:flex;justify-content:space-between;align-items:center;}
.goal-done{margin-top:8px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);border-radius:8px;padding:7px;text-align:center;font-size:12px;font-weight:700;color:var(--primary);}
.goal-add-btn{width:100%;margin-top:8px;padding:8px;background:var(--primary-dim);border:1px solid var(--primary);border-radius:8px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;}
.icon-grid{display:flex;flex-wrap:wrap;gap:6px;}
.ig-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--elevated);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}

/* ACCOUNTS */
.nw-banner{margin:0 16px 14px;background:linear-gradient(135deg,#0D1F18,#0A0A18);border:1px solid #1E2E28;border-radius:var(--rxl);padding:18px;text-align:center;}
.nw-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:2px;margin-bottom:6px;}
.nw-val{font-size:26px;font-weight:900;letter-spacing:-1px;}
.nw-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;}
.acc-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:13px;display:flex;align-items:center;justify-content:space-between;}
.acc-left{display:flex;align-items:center;gap:9px;}
.acc-ico{font-size:22px;width:40px;height:40px;border-radius:11px;background:var(--elevated);display:flex;align-items:center;justify-content:center;}
.acc-name{font-size:13px;font-weight:700;color:var(--text);}
.acc-type{font-size:11px;color:var(--muted);}
.acc-bal{font-size:14px;font-weight:800;}

/* MORE */
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.more-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:18px 16px;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;gap:4px;}
.more-card:active{background:var(--elevated);}
.mc-ico{font-size:28px;margin-bottom:4px;}
.mc-lbl{font-size:14px;font-weight:700;color:var(--text);}
.mc-cnt{font-size:12px;color:var(--text2);}

/* SETTINGS */
.profile-hero{margin:0 16px 14px;background:var(--card);border:1px solid var(--border2);border-radius:var(--rxl);padding:20px;text-align:center;}
.ph-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#10B981,#8B5CF6);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 0 20px rgba(16,185,129,0.2);}
.ph-name{font-size:16px;font-weight:800;color:var(--text);margin-bottom:3px;}
.ph-email{font-size:12px;color:var(--text2);margin-bottom:2px;}
.ph-since{font-size:11px;color:var(--muted);}
.logout-btn{padding:7px 12px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:var(--rf);font-family:var(--font);font-size:11px;font-weight:600;color:#EF4444;cursor:pointer;}
.setting-section{padding:12px 16px 0;}
.ss-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;}
.ss-desc{font-size:12px;color:var(--text2);margin-bottom:10px;line-height:18px;}
.theme-row{display:flex;gap:6px;}
.theme-opt{flex:1;padding:9px 4px;border-radius:var(--r);border:1px solid var(--border2);background:var(--elevated);font-family:var(--font);font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;}
.theme-opt.ton{border-color:var(--primary);background:var(--primary-dim);color:var(--primary);}
.curr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.curr-btn{display:flex;flex-direction:column;align-items:center;padding:7px 3px;border-radius:var(--r);background:var(--elevated);border:1px solid var(--border);cursor:pointer;overflow:hidden;transition:all 0.15s;}
.curr-btn.curr-on{border-color:var(--primary);background:var(--primary-dim);}
.cb-sym{font-size:13px;font-weight:700;color:var(--text);}
.cb-code{font-size:8px;color:var(--muted);font-weight:600;}
.curr-btn.curr-on .cb-sym,.curr-btn.curr-on .cb-code{color:var(--primary);}
.sms-area{width:100%;background:var(--elevated);border:1px solid var(--border);border-radius:var(--r);padding:11px;font-size:13px;color:var(--text);font-family:var(--font);resize:none;height:95px;outline:none;}
.sms-area:focus{border-color:var(--primary);}
.sms-area::placeholder{color:var(--muted);}
.setting-btn{width:100%;margin-top:10px;padding:12px;background:var(--elevated);border:1px solid var(--border2);border-radius:var(--r);font-family:var(--font);font-size:13px;font-weight:600;color:var(--text);cursor:pointer;}
.sms-result{background:var(--elevated);border-radius:var(--r);padding:13px;border:1px solid var(--border2);}
.sr-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:9px;}
.sr-row2{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;}
.sr-row2:last-of-type{border-bottom:none;}
.sr-row2 span:first-child{color:var(--text2);}
.sr-row2 span:last-child{color:var(--text);font-weight:600;}
.success-msg{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:var(--r);padding:10px;font-size:13px;color:var(--primary);font-weight:600;}
.founder-block{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:14px;margin-bottom:10px;}
.fb-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.fb-avatar{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#10B981,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;}
.fb-badge{background:var(--primary-dim);border:1px solid var(--primary);color:var(--primary);font-size:10px;font-weight:700;padding:3px 9px;border-radius:var(--rf);}
.fb-name{font-size:15px;font-weight:800;color:var(--text);margin-bottom:2px;}
.fb-role{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:8px;}
.fb-bio{font-size:12px;color:var(--text2);line-height:17px;margin-bottom:10px;}
.fb-tags{display:flex;flex-wrap:wrap;gap:5px;}
.fb-tags span{background:var(--elevated);border:1px solid var(--border);border-radius:var(--rf);padding:4px 9px;font-size:10px;color:var(--text2);}
.app-footer{background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:16px;text-align:center;}
.af-name{font-size:18px;font-weight:800;color:var(--primary);margin:4px 0;}
.af-sub{font-size:12px;color:var(--text2);margin-bottom:2px;}
.af-copy{font-size:11px;color:var(--muted);}
.danger-btn{width:calc(100% - 32px);margin:12px 16px;padding:12px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:var(--r);font-family:var(--font);font-size:13px;font-weight:600;color:#EF4444;cursor:pointer;}
.info-banner{margin:0 16px 12px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:12px;font-size:12px;color:var(--text2);line-height:18px;}

/* MODAL / SHEET */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.sheet{background:var(--card);border-top-left-radius:26px;border-top-right-radius:26px;width:100%;max-width:480px;border-top:1px solid var(--border2);max-height:93dvh;overflow-y:auto;animation:up 0.3s ease;}
.sheet::-webkit-scrollbar{display:none;}
.sheet-handle{width:36px;height:4px;background:var(--muted);border-radius:2px;margin:10px auto 4px;}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 14px;position:sticky;top:0;background:var(--card);z-index:1;}
.sheet-close{width:28px;height:28px;border-radius:50%;background:var(--elevated);border:none;color:var(--text2);font-size:13px;cursor:pointer;font-weight:700;}
.sheet-title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-0.3px;}
.sheet-body{padding:0 16px 20px;display:flex;flex-direction:column;gap:13px;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
.fi{background:var(--input);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;font-size:14px;color:var(--text);font-family:var(--font);width:100%;outline:none;transition:border-color 0.2s;}
.fi:focus{border-color:var(--primary);}
select.fi{appearance:none;}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.type-sw{display:flex;background:var(--elevated);border-radius:var(--r);padding:4px;}
.sw-btn{flex:1;padding:9px;border-radius:calc(var(--r) - 2px);border:none;font-family:var(--font);font-size:13px;font-weight:700;color:var(--text2);background:transparent;cursor:pointer;transition:all 0.2s;}
.sw-exp-on{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;}
.sw-inc-on{background:linear-gradient(135deg,#10B981,#059669);color:#fff;}
.big-amount{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 0;}
.ba-sym{font-size:26px;color:var(--text2);font-weight:300;}
.ba-inp{font-size:38px;font-weight:900;color:var(--text);background:transparent;border:none;outline:none;width:160px;letter-spacing:-2px;text-align:center;font-family:var(--font);}
.ba-inp::placeholder{color:var(--muted);}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px;}
.cg-btn{padding:7px 11px;border-radius:var(--rf);background:var(--elevated);border:1px solid var(--border);font-family:var(--font);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.15s;}
.check-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;}
.ferr{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--r);padding:10px;font-size:13px;color:#EF4444;}
.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,#10B981,#059669);border:none;border-radius:var(--r);font-family:var(--font);font-size:14px;font-weight:700;color:#fff;cursor:pointer;transition:opacity 0.2s;}
.submit-btn:hover{opacity:0.9;}
.submit-btn:disabled{opacity:0.5;}
.amt-wrap{display:flex;align-items:center;background:var(--input);border:1px solid var(--border);border-radius:var(--r);padding-left:12px;font-size:16px;color:var(--text2);}
.amt-wrap:focus-within{border-color:var(--primary);}
.del-btn{width:24px;height:24px;border-radius:50%;background:var(--elevated);border:none;color:var(--muted);font-size:11px;cursor:pointer;flex-shrink:0;}

/* TOAST */
.fp-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border2);border-radius:var(--rf);padding:10px 18px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:999;opacity:0;transition:all 0.3s;white-space:nowrap;max-width:90vw;}
.fp-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.fp-toast-err{border-color:rgba(239,68,68,0.4);}
.fp-toast-warn{border-color:rgba(245,158,11,0.4);}

/* RESPONSIVE */
@media(max-width:380px){.hero-amount{font-size:28px;}.ba-inp{font-size:32px;}.curr-grid{grid-template-columns:repeat(3,1fr);}.goals-grid{grid-template-columns:1fr;}}
@media(min-width:480px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border);}#modal{padding-bottom:0;}}
input[type="date"]::-webkit-calendar-picker-indicator,input[type="month"]::-webkit-calendar-picker-indicator{filter:invert(0.5);cursor:pointer;}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;}
</style>
</head>
